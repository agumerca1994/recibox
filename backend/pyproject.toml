[project]
name = "recibox-backend"
version = "0.1.0"
description = "Backend RECIBOX"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic-settings>=2.2",
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
  "pdfplumber>=0.11",
  "pymupdf>=1.24",
  "python-multipart>=0.0.9",
  "tenacity>=8.2",
  "firebase-admin>=6.5",
  "psycopg[binary]>=3.2",
]

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 8000
