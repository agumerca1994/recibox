services:
  recibox-test-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: recibox_test
      POSTGRES_USER: recibox
      POSTGRES_PASSWORD: recibox
    volumes:
      - recibox_test_postgres_data:/var/lib/postgresql/data
    networks:
      - test-internal

  recibox-test-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - recibox_test_redis_data:/data
    networks:
      - test-internal

  recibox-test-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - recibox-test-postgres
      - recibox-test-redis
    environment:
      APP_NAME: recibox-backend
      ENV: test
      LOG_LEVEL: INFO
      REDIS_URL: redis://recibox-test-redis:6379/0
      POSTGRES_URL: postgresql://recibox:recibox@recibox-test-postgres:5432/recibox_test
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/${GOOGLE_APPLICATION_CREDENTIALS_FILE:-service-account.json}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/${FIREBASE_CREDENTIALS_FILE:-firebase-admin.json}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-recibox-76a50}
      GOOGLE_OAUTH_CLIENT_SECRETS: /run/oauth-secrets/${GOOGLE_OAUTH_CLIENT_SECRETS_FILE:-oauth-client.json}
      GOOGLE_OAUTH_REDIRECT_URI: https://api-test.recibox.com.ar/auth/google/callback
      GOOGLE_OAUTH_SCOPES: https://www.googleapis.com/auth/drive
      GOOGLE_OAUTH_TOKEN_DIR: /app/backend/tmp/google_tokens
      OAUTH_REQUIRED_FOR_TENANT: "true"
      DRIVE_SUPPORTS_ALL_DRIVES: "true"
      DRIVE_INCLUDE_ITEMS_FROM_ALL_DRIVES: "true"
      DRIVE_PAGE_SIZE: "1000"
      POLL_INTERVAL_SECONDS: "60"
      OCR_ENABLED: "false"
      OCR_MIN_TEXT_LEN: "200"
      OCR_LANG: spa+eng
      LOCAL_DOWNLOAD_DIR: /app/backend/tmp/downloads
      RESULTS_LOG_PATH: /app/backend/tmp/results.jsonl
      RQ_JOB_TIMEOUT_SECONDS: "900"
    expose:
      - "8000"
    volumes:
      - recibox_test_tmp_data:/app/backend/tmp
      - ${TEST_SECRETS_DIR:-/opt/recibox-credentials/test}:/run/secrets:ro
      - ${OAUTH_SECRETS_DIR:-/opt/recibox-credentials}:/run/oauth-secrets:ro
    networks:
      - test-internal
      - easypanel

  recibox-test-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - recibox-test-postgres
      - recibox-test-redis
      - recibox-test-api
    command: ["rq", "worker", "recibox", "--url", "redis://recibox-test-redis:6379/0"]
    environment:
      APP_NAME: recibox-backend
      ENV: test
      LOG_LEVEL: INFO
      REDIS_URL: redis://recibox-test-redis:6379/0
      POSTGRES_URL: postgresql://recibox:recibox@recibox-test-postgres:5432/recibox_test
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/${GOOGLE_APPLICATION_CREDENTIALS_FILE:-service-account.json}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/${FIREBASE_CREDENTIALS_FILE:-firebase-admin.json}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-recibox-76a50}
      GOOGLE_OAUTH_CLIENT_SECRETS: /run/oauth-secrets/${GOOGLE_OAUTH_CLIENT_SECRETS_FILE:-oauth-client.json}
      GOOGLE_OAUTH_REDIRECT_URI: https://api-test.recibox.com.ar/auth/google/callback
      GOOGLE_OAUTH_SCOPES: https://www.googleapis.com/auth/drive
      GOOGLE_OAUTH_TOKEN_DIR: /app/backend/tmp/google_tokens
      OAUTH_REQUIRED_FOR_TENANT: "true"
      DRIVE_SUPPORTS_ALL_DRIVES: "true"
      DRIVE_INCLUDE_ITEMS_FROM_ALL_DRIVES: "true"
      DRIVE_PAGE_SIZE: "1000"
      POLL_INTERVAL_SECONDS: "60"
      OCR_ENABLED: "false"
      OCR_MIN_TEXT_LEN: "200"
      OCR_LANG: spa+eng
      LOCAL_DOWNLOAD_DIR: /app/backend/tmp/downloads
      RESULTS_LOG_PATH: /app/backend/tmp/results.jsonl
      RQ_JOB_TIMEOUT_SECONDS: "900"
    volumes:
      - recibox_test_tmp_data:/app/backend/tmp
      - ${TEST_SECRETS_DIR:-/opt/recibox-credentials/test}:/run/secrets:ro
      - ${OAUTH_SECRETS_DIR:-/opt/recibox-credentials}:/run/oauth-secrets:ro
    networks:
      - test-internal
      - easypanel

  recibox-test-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_FIREBASE_AUTH_ENABLED: ${VITE_FIREBASE_AUTH_ENABLED:-false}
        VITE_FIREBASE_ANALYTICS_ENABLED: ${VITE_FIREBASE_ANALYTICS_ENABLED:-false}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    restart: unless-stopped
    depends_on:
      - recibox-test-api
    environment:
      API_UPSTREAM: https://api-test.recibox.com.ar
      API_UPSTREAM_HOST: api-test.recibox.com.ar
      VITE_FIREBASE_AUTH_ENABLED: ${VITE_FIREBASE_AUTH_ENABLED:-false}
      VITE_FIREBASE_ANALYTICS_ENABLED: ${VITE_FIREBASE_ANALYTICS_ENABLED:-false}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    expose:
      - "80"
    networks:
      - easypanel

volumes:
  recibox_test_postgres_data:
  recibox_test_redis_data:
  recibox_test_tmp_data:

networks:
  test-internal:
    driver: bridge
  easypanel:
    external: true
