server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /home/index.html =404;
    }

    location = /index.html {
        try_files /home/index.html =404;
    }

    location = /politicasdeprivacidad {
        try_files /politicasdeprivacidad/index.html =404;
    }

    location = /politicasdeprivacidad/ {
        try_files /politicasdeprivacidad/index.html =404;
    }

    location = /terms {
        try_files /terms/index.html =404;
    }

    location = /terms/ {
        try_files /terms/index.html =404;
    }

    location = /politicas-de-privacidad {
        try_files /politicasdeprivacidad/index.html =404;
    }

    location = /politicas-de-privacidad/ {
        try_files /politicasdeprivacidad/index.html =404;
    }

    location = /terminos-y-condiciones {
        try_files /terms/index.html =404;
    }

    location = /terminos-y-condiciones/ {
        try_files /terms/index.html =404;
    }

    location = /home {
        try_files /home/index.html =404;
    }

    location = /home/ {
        try_files /home/index.html =404;
    }

    location = /planes {
        try_files /planes/index.html =404;
    }

    location = /planes/ {
        try_files /planes/index.html =404;
    }

    location = /precios {
        try_files /planes/index.html =404;
    }

    location = /precios/ {
        try_files /planes/index.html =404;
    }

    location = /faq {
        try_files /faq/index.html =404;
    }

    location = /faq/ {
        try_files /faq/index.html =404;
    }

    location = /preguntas-frecuentes {
        try_files /faq/index.html =404;
    }

    location = /preguntas-frecuentes/ {
        try_files /faq/index.html =404;
    }

    location = /centro-de-ayuda {
        try_files /faq/index.html =404;
    }

    location = /centro-de-ayuda/ {
        try_files /faq/index.html =404;
    }

    location / {
        try_files $uri $uri/ /home/index.html;
    }
}
