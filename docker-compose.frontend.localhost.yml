services:
  recibox-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_ENV: localhost
        VITE_FIREBASE_AUTH_ENABLED: ${VITE_FIREBASE_AUTH_ENABLED:-true}
        VITE_FIREBASE_ANALYTICS_ENABLED: ${VITE_FIREBASE_ANALYTICS_ENABLED:-false}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
        VITE_WEBSITE_BASE_URL: ${VITE_WEBSITE_BASE_URL:-http://localhost:8090}
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://recibox-api:8000}
      API_UPSTREAM_HOST: ${API_UPSTREAM_HOST:-recibox-api}
      VITE_APP_ENV: localhost
      VITE_TEMPLATE_LOCAL_UPLOAD_ENABLED: ${VITE_TEMPLATE_LOCAL_UPLOAD_ENABLED:-false}
    depends_on:
      - recibox-api
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - recibox-local

networks:
  recibox-local:
    driver: bridge
